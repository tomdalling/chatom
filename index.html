<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astu</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Astu</h1>
    <p class="tagline">Ash v2. A machine-parsable human language.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-button" data-tab="lookup" role="tab" aria-selected="true">Lookup</button>
    <button class="tab-button" data-tab="search" role="tab" aria-selected="false">Search</button>
    <button class="tab-button" data-tab="list" role="tab" aria-selected="false">List</button>
    <button class="tab-button" data-tab="parse" role="tab" aria-selected="false">Parse</button>
  </nav>

  <main>
    <section id="tab-lookup" class="tab-panel" role="tabpanel">
      <form id="lookup-form">
        <label for="lookup-word">Astu word</label>
        <input id="lookup-word" name="word" type="text" placeholder="e.g. dog" autocomplete="off" />
        <button type="submit">Lookup</button>
      </form>
      <div id="lookup-results" class="results"></div>
    </section>

    <section id="tab-search" class="tab-panel hidden" role="tabpanel">
      <form id="search-form">
        <label for="search-term">English term</label>
        <input id="search-term" name="term" type="text" placeholder="e.g. fire" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div id="search-results" class="results"></div>
    </section>

    <section id="tab-list" class="tab-panel hidden" role="tabpanel">
      <form id="list-form">
        <label for="list-pos">Part of speech</label>
        <select id="list-pos" name="pos">
          <option value="">All</option>
          <option value="noun">noun</option>
          <option value="pronoun">pronoun</option>
          <option value="verb">verb</option>
          <option value="adjective">adjective</option>
        </select>
        <button type="submit">List</button>
      </form>
      <div id="list-results" class="results"></div>
    </section>

    <section id="tab-parse" class="tab-panel hidden" role="tabpanel">
      <form id="parse-form">
        <label for="parse-sentence">Astu sentence (subject verb object)</label>
        <input id="parse-sentence" name="sentence" type="text" placeholder="e.g. mi si dog" autocomplete="off" />
        <button type="submit">Parse</button>
      </form>
      <div id="parse-results" class="results"></div>
    </section>
  </main>

  <footer>
    <p id="status"></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
